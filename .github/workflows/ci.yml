# Lint + unit tests + build check. No model download, no signing, no secrets.
# Linux for everything that runs there; one short macOS job for what only macOS has (Swift helpers, the sandbox-exec profile).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            claude_mcp/requirements.txt
      - run: pip install -r requirements-dev.txt -r claude_mcp/requirements.txt
      - run: ruff check proto tools tests claude_mcp
      - run: python -m pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore

  app:
    name: Electron app (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"     # nothing here launches Electron
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  macos:
    name: macOS (Swift helpers + network sandbox)
    needs: [python, app]                      # fail fast on the cheap Linux jobs before paying for macOS minutes
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Type-check the Swift helpers
        # the system-audio tap APIs need macOS 14.2 (README minimum); without -target, Xcode on macOS 14 assumes 14.0 and refuses them
        run: |
          for f in tools/audiocap.swift tools/ocr.swift tools/thermal.swift app/tools/meeting_probe.swift app/tools/mic_state.swift app/tools/launcher.swift; do
            echo "::group::$f"; swiftc -typecheck -target arm64-apple-macos14.2 "$f"; echo "::endgroup::"
          done
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: nonet.sb blocks TCP + DNS, allows only run/ Unix sockets
        run: python -m pytest tests/test_nonet_sandbox.py -v
      - name: Unit tests on macOS (libproc, BSD paths)
        run: python -m pytest -q
